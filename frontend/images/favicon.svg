<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#14181A" />
            <stop offset="100%" stopColor="#1B1F3B" />
        </linearGradient>
        <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stopColor="#3b82f6" />
            <stop offset="100%" stopColor="#ec4899" />
        </linearGradient>
    </defs>
    
    <!-- Rounded-square background -->
    <rect width="40" height="40" rx="10" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <!-- Stadium Arc Main -->
    <path d="M 8 26 C 8 26, 14 14, 20 14 C 26 14, 32 26, 32 26" fill="none" stroke="url(#arcGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Stadium Arc Secondary (Depth) -->
    <path d="M 12 30 C 12 30, 16 20, 20 20 C 24 20, 28 30, 28 30" fill="none" stroke="url(#arcGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    
    <!-- Gold dot -->
    <circle cx="20" cy="9" r="2.5" fill="#C9A24B" />
</svg>
